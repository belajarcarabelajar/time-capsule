name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run quality tests
        run: bun run test:quality

      - name: Lint web application
        run: bun run --cwd apps/web lint

      - name: Build
        run: bun run build
      - name: Verify client assets
        run: bun run test:client-assets

